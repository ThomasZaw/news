name: Live feed
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/fetch_feeds.py data/live.json
        env:
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
      - run: |
          mkdir -p _site
          cp -r index.html app.js sw.js manifest.webmanifest icon-180.png icon-512.png robots.txt sitemap.xml data lib _site/
          V="$(git rev-parse --short HEAD)"
          sed -i "s/__V__/$V/g" _site/index.html
          printf '{"v":"%s"}' "$V" > _site/data/version.json
          python scripts/pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: sleep 45
      - id: deployment
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
