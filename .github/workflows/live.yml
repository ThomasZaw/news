name: Live feed
on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_push:
        description: Send a test phone notification
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_feeds.py data/live.json
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
      - if: ${{ inputs.test_push }}
        run: curl -sS -H "Title: Parabaik Daily" -d "Test alert. Notifications are working." "https://ntfy.sh/${{ vars.NTFY_TOPIC }}"
      - run: |
          mkdir -p _site
          cp -r index.html app.js manifest.webmanifest icon-180.png icon-512.png data lib _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
