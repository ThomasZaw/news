name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          echo "=====DMHTEXT"; for n in 135246 134834; do curl -sS -m 25 -A "$UA" -L https://www.moezala.gov.mm/my/news/$n | python3 -c "import sys,re,html;t=sys.stdin.read();i=t.find('field-node--body');t=t[i:i+20000];t=re.sub(r'<[^>]+>',' ',t);print(re.sub(r'\s+',' ',html.unescape(t))[:1500])"; echo; done
          echo "=====NCSROWS"; curl -sS -m 30 -A "$UA" -L https://riseq.seismo.gov.in/riseq/earthquake/recent_earthquake -o ncs.html || true; sed -n '1025,1050p' ncs.html | cut -c1-300; grep -c "<td>Myanmar</td>" ncs.html
