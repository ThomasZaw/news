name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          echo "=====DMHNODE"; curl -sS -m 25 -A "$UA" -L https://www.moezala.gov.mm/my/news/135246 -o n.html -w "%{http_code}\n"; grep -n "field--name-body\|field-item\|<p" n.html | head -12 | cut -c1-900
          echo "=====DMHNODE2"; curl -sS -m 25 -A "$UA" -L https://www.moezala.gov.mm/my/news/134834 | grep -n "<p\|<img" | head -8 | cut -c1-900
          echo "=====NCS"; curl -sS -m 30 -A "$UA" -L https://riseq.seismo.gov.in/riseq/earthquake/recent_earthquake -o ncs.html -w "%{http_code} %{size_download}\n" || true; grep -o -i "[a-z_/.-]*\(json\|ajax\|api\)[a-z_/?=.-]*" ncs.html | sort -u | head -20; grep -n -i "myanmar" ncs.html | head -6 | cut -c1-600; grep -n -i "<tr\|data-json\|JSON.parse" ncs.html | head -6 | cut -c1-400
